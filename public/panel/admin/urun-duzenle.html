<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ürün Düzenle | Voltra Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../img/favicon.svg">
<link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<script src="../js/data.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/admin.js"></script>
<script>
const root = renderShell("urunler.html", "Ürün Ekle / Güncelle", '<a class="btn btn-sm btn-outline-secondary" href="urunler.html">← Listeye dön</a>');
let db = DB.load();
const id = new URLSearchParams(location.search).get("id");
const isNew = !id;
const IMAGES = ["img/bilgisayar.jpg","img/telefon.jpg","img/tablet.jpg","img/ses.jpg","img/monitor.jpg","img/aksesuar.jpg","img/hoparlor.jpg","img/saat.jpg"];
let p = isNew ? {
  id: uid("p"), name: "", sku: "", barcode: "", category: "", subcategory: "", brand: "", tags: [],
  shortDesc: "", desc: "", seoTitle: "", seoDesc: "", slug: "", metaKeywords: "", cover: IMAGES[0], gallery: [IMAGES[0]],
  price: 0, salePrice: null, listPrice: 0, vat: 20, status: "taslak", minStock: 5, criticalStock: 2, stock: 0,
  variants: [], deletedAt: null, createdAt: new Date().toISOString().slice(0, 10),
} : JSON.parse(JSON.stringify(db.products.find(x => x.id === id)));

if (!p) { root.innerHTML = '<div class="card-a">Ürün bulunamadı.</div>'; throw new Error("not found");
}

function subOptions(cat, sel) {
  return db.categories.filter(c => c.parent === cat).map(c => `<option value="${c.slug}" ${sel === c.slug ? "selected" : ""}>${c.name}</option>`).join("");
}

function render() {
  root.innerHTML = `
  <form id="pf">
  <div class="row g-3">
    <div class="col-lg-8">
      <div class="card-a">
        <h2 class="h6 mb-3">Temel Bilgiler</h2>
        <div class="row g-3">
          <div class="col-md-8"><label class="form-label">Ürün Adı *</label><input class="form-control" name="name" value="${p.name}" required></div>
          <div class="col-md-4"><label class="form-label">Marka</label><input class="form-control" name="brand" value="${p.brand}" list="brandList"><datalist id="brandList">${[...new Set(db.products.map(x => x.brand))].map(b => `<option>${b}</option>`).join("")}</datalist></div>
          <div class="col-md-4"><label class="form-label">SKU * (benzersiz)</label><input class="form-control" name="sku" value="${p.sku}" required></div>
          <div class="col-md-4"><label class="form-label">Barkod (GTIN/EAN)</label><input class="form-control" name="barcode" value="${p.barcode}"></div>
          <div class="col-md-4"><label class="form-label">Durum *</label><select class="form-select" name="status">${[["taslak","Taslak"],["yayinda","Yayında"],["pasif","Pasif/Arşiv"]].map(([v,n]) => `<option value="${v}" ${p.status===v?"selected":""}>${n}</option>`).join("")}</select></div>
          <div class="col-md-6"><label class="form-label">Kategori *</label><select class="form-select" name="category" id="catSel" required><option value="">Seçiniz</option>${db.categories.filter(c => !c.parent).map(c => `<option value="${c.id}" ${p.category===c.id?"selected":""}>${c.name}</option>`).join("")}</select></div>
          <div class="col-md-6"><label class="form-label">Alt Kategori</label><select class="form-select" name="subcategory" id="subSel"><option value="">Seçiniz</option>${subOptions(p.category, p.subcategory)}</select></div>
          <div class="col-12"><label class="form-label">Etiketler</label><div class="d-flex gap-3 flex-wrap">${TAGS.map(t => `<label class="form-check"><input class="form-check-input tag" type="checkbox" value="${t.id}" ${p.tags.includes(t.id)?"checked":""}> <span class="form-check-label">${t.name}</span></label>`).join("")}</div></div>
          <div class="col-12"><label class="form-label">Kısa Açıklama *</label><textarea class="form-control" name="shortDesc" rows="2" maxlength="200" required>${p.shortDesc}</textarea></div>
          <div class="col-12"><label class="form-label">Uzun Açıklama (HTML) *</label><textarea class="form-control" name="desc" rows="6" required>${p.desc.replace(/</g, "&lt;")}</textarea><div class="muted small mt-1">HTML etiketleri desteklenir: &lt;p&gt;, &lt;ul&gt;, &lt;b&gt;…</div></div>
        </div>
      </div>

      <div class="card-a">
        <h2 class="h6 mb-3">Fiyatlandırma</h2>
        <div class="row g-3">
          <div class="col-md-3"><label class="form-label">Fiyat *</label><input class="form-control" type="number" step="0.01" name="listPrice" value="${p.listPrice || p.price}" required></div>
          <div class="col-md-3"><label class="form-label">İndirimli Fiyat</label><input class="form-control" type="number" step="0.01" name="salePrice" value="${p.salePrice ?? ""}"></div>
          <div class="col-md-3"><label class="form-label">KDV Oranı (%) *</label><select class="form-select" name="vat">${[0,1,10,20].map(v => `<option ${p.vat===v?"selected":""}>${v}</option>`).join("")}</select></div>
          <div class="col-md-3"><label class="form-label">Stok (varyantsız)</label><input class="form-control" type="number" name="stock" value="${p.stock}" ${p.variants.length ? "disabled" : ""}></div>
          <div class="col-md-3"><label class="form-label">Minimum Stok</label><input class="form-control" type="number" name="minStock" value="${p.minStock}"></div>
          <div class="col-md-3"><label class="form-label">Kritik Stok</label><input class="form-control" type="number" name="criticalStock" value="${p.criticalStock}"></div>
        </div>
        <div class="text-danger small mt-2 d-none" id="priceErr">İndirimli fiyat, fiyattan küçük olmalıdır.</div>
      </div>

      <div class="card-a">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h6 m-0">Varyant Yönetimi (Renk × Beden)</h2>
          <button type="button" class="btn btn-sm btn-outline-primary" id="addVar">+ Varyant Ekle</button>
        </div>
        <div class="table-wrap"><table class="table-a">
          <thead><tr><th>Renk</th><th>Beden</th><th>Varyant SKU</th><th>Stok</th><th>Fiyat</th><th>İnd. Fiyat</th><th>Görsel</th><th></th></tr></thead>
          <tbody id="varBody">${p.variants.map((v, i) => varRow(v, i)).join("") || `<tr><td colspan="8" class="muted">Varyant yok — stok ve fiyat ürün seviyesinde tutulur.</td></tr>`}</tbody>
        </table></div>
        <div class="muted small mt-2">Toplam varyant stoğu: <b id="varTotal">${p.variants.reduce((s, v) => s + Number(v.stock || 0), 0)}</b></div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card-a">
        <h2 class="h6 mb-3">Görseller</h2>
        <label class="form-label">Kapak Resmi *</label>
        <img class="w-100 rounded mb-2" style="height:150px;object-fit:cover" id="coverPrev" src="${asset(p.cover)}" alt="">
        <select class="form-select mb-3" name="cover" id="coverSel">${IMAGES.map(i => `<option value="${i}" ${p.cover===i?"selected":""}>${i.split("/").pop()}</option>`).join("")}</select>
        <label class="form-label">Galeri (çoklu seçim)</label>
        <select class="form-select" multiple size="6" id="gallerySel">${IMAGES.map(i => `<option value="${i}" ${p.gallery.includes(i)?"selected":""}>${i.split("/").pop()}</option>`).join("")}</select>
        <div class="muted small mt-1">Kendi görsellerinizi <code>img/</code> klasörüne ekleyip listeyi <code>admin/urun-duzenle.html</code> içindeki IMAGES dizisinden genişletebilirsiniz.</div>
      </div>

      <div class="card-a">
        <h2 class="h6 mb-3">SEO</h2>
        <div class="mb-2"><label class="form-label">SEO Başlığı</label><input class="form-control" name="seoTitle" value="${p.seoTitle}"></div>
        <div class="mb-2"><label class="form-label">SEO Açıklaması</label><textarea class="form-control" name="seoDesc" rows="3">${p.seoDesc}</textarea></div>
        <div class="mb-2"><label class="form-label">SEO URL (slug) *</label><input class="form-control" name="slug" value="${p.slug}" required></div>
        <div><label class="form-label">Meta Etiketleri</label><input class="form-control" name="metaKeywords" value="${p.metaKeywords}"></div>
      </div>

      <div class="card-a d-grid gap-2">
        <button class="btn btn-primary" type="submit">Kaydet</button>
        <button class="btn btn-outline-secondary" type="button" id="saveDraft">Taslak Olarak Kaydet</button>
        ${isNew ? "" : `<button class="btn btn-outline-danger" type="button" id="archive">Arşivle (soft delete)</button>`}
      </div>
    </div>
  </div>
  </form>`;
  bind();
}

function varRow(v, i) {
  return `<tr class="variant-row" data-i="${i}">
    <td><input class="form-control form-control-sm v-color" value="${v.color}"></td>
    <td><input class="form-control form-control-sm v-size" value="${v.size || ""}"></td>
    <td><input class="form-control form-control-sm v-sku" value="${v.sku}"></td>
    <td><input class="form-control form-control-sm v-stock" type="number" value="${v.stock}" style="width:90px"></td>
    <td><input class="form-control form-control-sm v-price" type="number" value="${v.price}" style="width:110px"></td>
    <td><input class="form-control form-control-sm v-sale" type="number" value="${v.salePrice ?? ""}" style="width:110px"></td>
    <td><select class="form-select form-select-sm v-img">${["", ...IMAGES].map(x => `<option value="${x}" ${v.image===x?"selected":""}>${x ? x.split("/").pop() : "—"}</option>`).join("")}</select></td>
    <td><button type="button" class="btn btn-sm btn-outline-danger v-del">Sil</button></td>
  </tr>`;
}

function collectVariants() {
  return $$("#varBody tr.variant-row").map((tr, i) => ({
    id: p.variants[i]?.id || uid("v"),
    color: $(".v-color", tr).value, size: $(".v-size", tr).value, sku: $(".v-sku", tr).value,
    stock: Number($(".v-stock", tr).value || 0), price: Number($(".v-price", tr).value || 0),
    salePrice: $(".v-sale", tr).value ? Number($(".v-sale", tr).value) : null, image: $(".v-img", tr).value,
  }));
}

function bind() {
  $("#catSel").onchange = (e) => { $("#subSel").innerHTML = '<option value="">Seçiniz</option>' + subOptions(e.target.value, ""); };
  $("#coverSel").onchange = (e) => { $("#coverPrev").src = asset(e.target.value); };
  $("#addVar").onclick = () => {
    p.variants = collectVariants();
    p.variants.push({ id: uid("v"), color: "", size: "Tek Beden", sku: ($("[name=sku]").value || "SKU") + "-" + (p.variants.length + 1), stock: 0, price: Number($("[name=listPrice]").value || 0), salePrice: null, image: "" });
    render();
  };
  $$(".v-del").forEach(b => b.onclick = (e) => { const i = Number(e.target.closest("tr").dataset.i); p.variants = collectVariants(); p.variants.splice(i, 1); render(); });
  $$(".v-stock").forEach(i => i.oninput = () => { $("#varTotal").textContent = collectVariants().reduce((s, v) => s + v.stock, 0); });
  $("#pf").onsubmit = (e) => { e.preventDefault(); save(); };
  $("#saveDraft").onclick = () => { $("[name=status]").value = "taslak"; if ($("#pf").reportValidity()) save(); };
  const arch = $("#archive");
  if (arch) arch.onclick = () => {
    if (!confirm("Ürün arşivlenecek (sipariş geçmişi korunur). Onaylıyor musunuz?")) return;
    const t = db.products.find(x => x.id === p.id); t.deletedAt = new Date().toISOString().slice(0, 10); t.status = "pasif";
    DB.save(db); location.href = "urunler.html";
  };
}

function save() {
  const f = new FormData($("#pf"));
  const o = Object.fromEntries(f.entries());
  const listPrice = Number(o.listPrice || 0);
  const salePrice = o.salePrice ? Number(o.salePrice) : null;
  if (salePrice !== null && salePrice >= listPrice) { $("#priceErr").classList.remove("d-none"); return; }
  const dupSku = db.products.some(x => x.id !== p.id && !x.deletedAt && x.sku.toLowerCase() === o.sku.trim().toLowerCase());
  const dupSlug = db.products.some(x => x.id !== p.id && !x.deletedAt && x.slug === (o.slug || slugify(o.name)));
  if (dupSku) return toast("Bu SKU başka bir üründe kullanılıyor", "error");
  if (dupSlug) return toast("Bu SEO URL (slug) zaten kullanılıyor", "error");

  Object.assign(p, {
    name: o.name.trim(), brand: o.brand.trim(), sku: o.sku.trim(), barcode: o.barcode.trim(),
    category: o.category, subcategory: o.subcategory, status: o.status,
    tags: $$(".tag:checked").map(c => c.value),
    shortDesc: o.shortDesc, desc: o.desc, seoTitle: o.seoTitle, seoDesc: o.seoDesc,
    slug: (o.slug || slugify(o.name)).trim(), metaKeywords: o.metaKeywords,
    cover: o.cover, gallery: Array.from($("#gallerySel").selectedOptions).map(x => x.value),
    listPrice, salePrice, price: salePrice ?? listPrice, vat: Number(o.vat),
    minStock: Number(o.minStock || 0), criticalStock: Number(o.criticalStock || 0),
    variants: collectVariants(),
  });
  if (!p.gallery.length) p.gallery = [p.cover];
  p.stock = p.variants.length ? p.variants.reduce((s, v) => s + v.stock, 0) : Number(o.stock || 0);

  const idx = db.products.findIndex(x => x.id === p.id);
  if (idx > -1) db.products[idx] = p; else db.products.unshift(p);
  DB.save(db);
  toast("Ürün kaydedildi");
  setTimeout(() => location.href = "urunler.html", 700);
}
render();
</script>
</body>
</html>
