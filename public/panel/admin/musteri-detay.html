<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Müşteri Detayı | Voltra Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../img/favicon.svg">
<link rel="stylesheet" href="../vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<script src="../js/data.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/admin.js"></script>
<script>
const root = renderShell("musteriler.html", "Müşteri Detayı", '<a class="btn btn-sm btn-outline-secondary" href="musteriler.html">← Müşteriler</a>');
let db = DB.load();
const cid = new URLSearchParams(location.search).get("id");
let c = db.customers.find(x => x.id === cid);

function render() {
  if (!c) { root.innerHTML = '<div class="card-a">Müşteri bulunamadı.</div>'; return; }
  const orders = db.orders.filter(o => o.customerId === c.id);
  root.innerHTML = `
  <div class="row g-3">
    <div class="col-lg-5">
      <div class="card-a">
        <h2 class="h6 mb-3">Profil Bilgileri</h2>
        <div><b>${c.name}</b> <span class="badge text-bg-${c.active ? "success" : "danger"}">${c.active ? "Aktif" : "Askıda"}</span></div>
        <div class="muted small mt-1">${c.email}<br>${c.phone}</div>
        <div class="muted small mt-2">Üyelik: ${c.createdAt} · Son giriş: ${c.lastLogin}</div>
        <button class="btn btn-sm ${c.active ? "btn-outline-danger" : "btn-outline-success"} mt-3" id="toggle">${c.active ? "Hesabı Askıya Al" : "Hesabı Aktifleştir"}</button>
      </div>
      <div class="card-a">
        <h2 class="h6 mb-3">Adresler</h2>
        ${c.addresses.map(a => `<div class="border rounded p-2 mb-2 small"><b>${a.title}</b><br>${a.line}<br>${a.district} / ${a.city}</div>`).join("")}
      </div>
    </div>
    <div class="col-lg-7"><div class="card-a">
      <h2 class="h6 mb-3">Sipariş Geçmişi</h2>
      <div class="table-wrap"><table class="table-a">
        <thead><tr><th>Sipariş No</th><th>Tarih</th><th>Tutar</th><th>Durum</th><th></th></tr></thead>
        <tbody>${orders.map(o => `<tr><td>${o.id}</td><td>${o.date}</td><td>${money(o.total)}</td><td>${statusBadge(o.status)}</td><td><a class="btn btn-sm btn-outline-secondary" href="siparis-detay.html?id=${encodeURIComponent(o.id)}">Detay</a></td></tr>`).join("") || `<tr><td colspan="5" class="muted">Sipariş yok.</td></tr>`}</tbody>
      </table></div>
      <div class="muted small mt-2">Toplam harcama: <b>${money(orders.filter(o => o.status !== "iptal").reduce((s, o) => s + o.total, 0))}</b></div>
    </div></div>
  </div>`;
  $("#toggle").onclick = () => {
    c.active = !c.active; DB.save(db);
    toast(c.active ? "Hesap aktifleştirildi" : "Hesap askıya alındı"); render();
  };
}
render();
</script>
</body>
</html>
